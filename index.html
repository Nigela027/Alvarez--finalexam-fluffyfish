<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flappy Fish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/fish icon.png">
</head>
<body>
  <div id="gameContainer">
    <div id="startScreen">
      <h1>Flappy Fish</h1>
      <p>Help the fish swim through the pipes!</p>
      <p>Avoid hitting them or you'll lose!</p>
      <p>Tap or press space to swim!</p>
      <button id="startButton">Start Game</button>
    </div>
    
    <div id="gameOverScreen">
      <h1>Game Over!!!</h1>
      <p id="finalScore">Your Score: 0</p>
      <button id="restartBtn">Restart</button>
    </div>
    
    <canvas id="gameCanvas" width="1000" height="700"></canvas>
  </div>

  <audio id="flapSound" src="assets/sounds/SFX_Wing - Flap.mp3" preload="auto"></audio>
  <audio id="themeSound" src="assets/sounds/Flappy Bird Theme.mp3" loop preload="auto"></audio>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.error('Service Worker error:', err));
    }
  </script>
</body>
</html>
